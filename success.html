<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent | Digital Masly</title>
  <link rel="icon" href="assets/images/logo-v1.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0a10; --ink:#f3f1ec; --ink-dim:#a7a4b6; --violet:#8b6bff; --blue:#4c7cff;
      --line:rgba(199,197,214,0.14);
      --grad: linear-gradient(120deg,#8b6bff,#4c7cff);
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--ink); font-family:'Manrope',sans-serif; padding:24px;
    }
    .card{
      max-width:440px; width:100%; text-align:center; border:1px solid var(--line);
      border-radius:20px; padding:48px 36px; background:#0e0e16;
    }
    .mark{
      width:56px; height:56px; margin:0 auto 22px; border-radius:50%;
      background:var(--grad); display:flex; align-items:center; justify-content:center;
      font-size:24px; color:#fff;
    }
    h1{ font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:26px; margin:0 0 12px; }
    p{ color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0 0 28px; }
    a{
      display:inline-flex; align-items:center; gap:8px; text-decoration:none;
      padding:13px 26px; border-radius:999px; background:var(--ink); color:var(--bg);
      font-size:13px; font-weight:600; letter-spacing:.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">&#10003;</div>
    <h1>Message sent</h1>
    <p>Thanks for reaching out — the Digital Masly team will get back to you within one business day.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
